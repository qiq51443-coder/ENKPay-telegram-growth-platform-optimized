services:
  - type: web
    name: telegram-growth-platform
    runtime: node
    region: frankfurt
    plan: standard
    autoDeploy: false
    healthCheckPath: /health
    buildCommand: |
      cd mini-app && npm ci && npm run build && cd .. && \
      cd admin-panel && npm ci && npm run build && cd .. && \
      cd backend && npm ci && npm run build && \
      mkdir -p dist/public/admin dist/public/app && \
      cp -r ../admin-panel/dist/. dist/public/admin/ && \
      cp -r ../mini-app/dist/. dist/public/app/
    preDeployCommand: cd backend && node -e "require('./dist/db/migrate').runMigrations().then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1)})"
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_WEBHOOK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-growth-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: telegram-growth-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: BINANCE_API_URL
        value: https://api.binance.com
      - key: BACKEND_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_DOMAIN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DB_POOL_MAX
        value: "20"
      - key: DB_POOL_MIN
        value: "5"
      - key: WALLET_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: BETA_MODE
        value: "true"
      - key: MAX_USERS
        value: "1000"
      - key: LOG_LEVEL
        value: debug

  - type: redis
    name: telegram-growth-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  - name: telegram-growth-db
    databaseName: telegram_growth
    region: frankfurt
    plan: basic
