services:
  - type: web
    name: telegram-growth-platform
    runtime: node
    region: singapore
    plan: starter
    buildCommand: |
      cd mini-app && npm ci && npm run build && cd .. && \
      cd admin-panel && npm ci && npm run build && cd .. && \
      cd backend && npm ci && npm run build && \
      mkdir -p dist/public/admin dist/public/app && \
      cp -r ../admin-panel/dist/. dist/public/admin/ && \
      cp -r ../mini-app/dist/. dist/public/app/
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_WEBHOOK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-growth-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: telegram-growth-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: BINANCE_API_URL
        value: https://api.binance.com
      - key: BACKEND_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_DOMAIN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false

databases:
  - name: telegram-growth-db
    databaseName: telegram_growth
    region: singapore
    plan: free

  - type: redis
    name: telegram-growth-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
