services:
  - type: web
    name: telegram-growth-platform
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm run render-build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_WEBHOOK
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-growth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: BINANCE_API_URL
        value: https://api.binance.com

databases:
  - name: telegram-growth-db
    databaseName: telegram_growth
    region: singapore
    plan: free
