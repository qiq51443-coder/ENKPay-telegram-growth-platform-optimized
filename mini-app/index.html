<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ENKPay Mini App</title>
    <!-- Telegram Web App SDK — loaded async to avoid render blocking -->
    <script>
      (function() {
        var script = document.createElement('script');
        script.src = 'https://telegram.org/js/telegram-web-app.js';
        script.async = true;
        script.onerror = function() {
          console.warn('[ENKPay] Failed to load Telegram SDK from CDN. Will rely on SDK already injected by Telegram client.');
        };
        document.head.appendChild(script);
      })();
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background-color: #0A1628; color: #e0e6f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
